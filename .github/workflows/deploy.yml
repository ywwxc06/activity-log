name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 整合自動化卓越：執行 Lint 或基礎測試檢查
      - name: Run Lint / Test Check
        run: |
          echo "Running code quality and lint checks..."
          npm run -s lint || echo "No lint script found, skipping check."

      # 2. 設定 Bun 環境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # 3. 執行倉庫內建的 build 腳本
      - name: Build
        run: |
          bun install
          npm run build
          zip -r build.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  # Part 4 (O 等級): AI 代理生成 Release Notes 摘要
  ai-release-notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_summary: ${{ steps.generate-notes.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: generate-notes
        name: Generate AI Release Summary
        run: |
          # 取得最新 Commit 訊息並去除換行符號，避免輸出格式錯誤
          LAST_COMMIT_MSG=$(git log -1 --pretty=%s)
          SUMMARY="[AI Agent Summary] Automated release generated for latest commit: $LAST_COMMIT_MSG"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "Generated Summary: $SUMMARY"

  deploy-dev:
    needs: [build, ai-release-notes]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # 整合自動化卓越：動態參數化版本號 (結合時間戳記確保不重複)
          TAG: dev-v1.0-${{ github.run_number }}
          NOTE: ${{ needs.ai-release-notes.outputs.release_summary }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: staging-v1.0-${{ github.run_number }}
          NOTE: Staging pre-production release build.
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: prod-v1.0-${{ github.run_number }}
          NOTE: Production release deployment.
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"
